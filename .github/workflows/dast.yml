# SEC-23: DAST com OWASP ZAP (API scan a partir da especificação OpenAPI).
# Enquanto não houver staging (BE-44), sobe uma instância temporária da API + MySQL 8 dentro do job.
# Quando o staging existir, trocar o alvo para a URL de staging e remover a etapa "Subir API".
name: DAST (OWASP ZAP)

on:
  schedule:
    - cron: '0 6 * * 1' # segundas, 03:00 (BRT)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # o ZAP abre/atualiza uma issue com o relatório

jobs:
  zap-api-scan:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dast-root-password
          MYSQL_DATABASE: barberos_dast
          MYSQL_USER: barberos
          MYSQL_PASSWORD: dast-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdast-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: barberos
      DB_PASS: dast-password
      DB_NAME: barberos_dast
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Subir API
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          nohup node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/docs.json > /dev/null
      - name: OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:3000/api/docs.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: true
          fail_action: true
      - name: Log da API
        if: always()
        run: cat api.log
