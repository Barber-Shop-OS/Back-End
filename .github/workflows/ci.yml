# BE-09 / SEC-16: CI do back-end. Roda em todo PR e push na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, testes e cobertura (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Dependências de produção sem vulnerabilidade alta/crítica
        run: npm audit --omit=dev --audit-level=high

  postgres:
    name: Suíte completa em PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberos_test
          POSTGRES_USER: barberos
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U barberos -d barberos_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DB_DIALECT: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: barberos
      DB_PASS: ci-password
      DB_NAME: barberos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Suíte inteira no PostgreSQL real (o banco de produção — Supabase): ENUM, DECIMAL, índices, FKs,
      # FOR UPDATE da reserva (BE-14), SKIP LOCKED da fila (BE-16), ILIKE/Haversine da busca (BE-25).
      - run: npx jest --runInBand --forceExit

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
