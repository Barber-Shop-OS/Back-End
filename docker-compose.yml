services:
  db:
    image: mysql:5.7
    container_name: barberos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: barbershop_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: barberos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: barbershop_db
      JWT_SECRET: your_jwt_secret
    ports:
      - "3000:3000"

volumes:
  db_data: