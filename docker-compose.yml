# Ambiente local. Exige um .env (ver .env.example) — não há senhas/segredos padrão (SEC-05, SEC-14).
services:
  db:
    image: mysql:8.0
    container_name: barberos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Defina DB_ROOT_PASS no .env}
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME no .env}
      # Usuário da aplicação (não-root).
      MYSQL_USER: ${DB_USER:?Defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: barberos-api
    # Permite alcançar serviços do host (ex.: simuladores locais) em host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (mínimo 32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      JOBS_WORKER: ${JOBS_WORKER:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EXPO_PUSH_URL: ${EXPO_PUSH_URL:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-1.0.0}
      LATEST_APP_VERSION: ${LATEST_APP_VERSION:-1.0.0}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-}
      TERMS_VERSION: ${TERMS_VERSION:-2026-11}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-true}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-strict}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-false}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_METHODS: ${ABACATEPAY_METHODS:-CARD}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
      ABACATEPAY_WEBHOOK_PUBLIC_KEY: ${ABACATEPAY_WEBHOOK_PUBLIC_KEY:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db_data:
